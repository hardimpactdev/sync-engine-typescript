name: Publish

# A published GitHub release (tag vX.Y.Z) publishes that version to npm through
# npm Trusted Publishing: no token is stored, and the package gets provenance.

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  # Trusted Publishing needs npm 11.5.1 or later.
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci
            - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
            - run: npm publish
